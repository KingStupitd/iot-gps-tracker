<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT GPS Live Tracker</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Floating Glassmorphism Overlay Card */
    .overlay-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      width: 360px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .info-box.full-width {
      grid-column: span 2;
    }

    .info-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-all;
    }

    /* Simulation Control Section */
    .simulator-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .simulator-title {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-group input {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 6px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-msg {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }

    .status-success { color: #34d399; }
    .status-ignored { color: #fbbf24; }
    .status-error { color: #f87171; }

    @media (max-width: 480px) {
      .overlay-panel {
        width: calc(100% - 40px);
        top: 10px;
        left: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating Information Card -->
  <div class="overlay-panel">
    <div class="panel-header">
      <h2>🛰️ IoT GPS Tracker</h2>
      <div class="badge-live">
        <div class="pulse-dot"></div>
        LIVE (3s)
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">Latitude</div>
        <div class="info-value" id="val-lat">-</div>
      </div>
      <div class="info-box">
        <div class="info-label">Longitude</div>
        <div class="info-value" id="val-lng">-</div>
      </div>
      <div class="info-box full-width">
        <div class="info-label">Waktu Terakhir</div>
        <div class="info-value" id="val-time">Menunggu data...</div>
      </div>
      <div class="info-box full-width">
        <div class="info-label">Total Titik Lintasan</div>
        <div class="info-value" id="val-total">0 titik</div>
      </div>
    </div>

    <!-- Simulator Demo Section -->
    <div class="simulator-section">
      <div class="simulator-title">
        <span>🎮 Simulator Demo IoT</span>
      </div>
      <form id="sim-form">
        <div class="input-group">
          <input type="text" id="input-lat" placeholder="Latitude" required>
          <input type="text" id="input-lng" placeholder="Longitude" required>
        </div>
        <button type="submit" class="btn">🚀 Kirim Koordinat</button>
      </form>
      <button type="button" id="btn-random-step" class="btn btn-secondary">🎲 Move Random Step (+0.001)</button>
      <div id="status-msg" class="status-msg"></div>
    </div>
  </div>

  <!-- Leaflet JS via CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
